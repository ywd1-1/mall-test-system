server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: mall-test-system
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mall_test_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  bootstrap-admin-password: ${ADMIN_PASSWORD:}

logging:
  level:
    com.example.malltestsystem: info
